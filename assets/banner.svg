<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="50%" stop-color="#05080c"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#162230" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Terminal Window Mockup Frame -->
  <rect x="80" y="40" width="1040" height="320" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <path d="M 80 50 Q 80 40 90 40 L 1110 40 Q 1120 40 1120 50 L 1120 75 L 80 75 Z" fill="#161b22"/>
  <circle cx="105" cy="58" r="6" fill="#ff5f56"/>
  <circle cx="125" cy="58" r="6" fill="#ffbd2e"/>
  <circle cx="145" cy="58" r="6" fill="#27c93f"/>
  <text x="600" y="62" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" text-anchor="middle" font-weight="600">shadowline — ssh session — 2222/tcp</text>

  <!-- Main Title -->
  <text x="600" y="165" fill="url(#cyanGlow)" font-family="Courier New, monospace" font-size="54" font-weight="900" letter-spacing="8" text-anchor="middle" filter="url(#glow)">SHADOWLINE</text>
  
  <!-- Subtitle -->
  <text x="600" y="210" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="18" letter-spacing="3" text-anchor="middle" font-weight="500">HARDENED RETRO TERMINAL CHAT SERVER</text>
  
  <!-- Badges / Pillars Inside Terminal -->
  <g transform="translate(230, 260)" font-family="Courier New, monospace" font-size="13">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#1f242c" stroke="#00f2fe" stroke-width="1"/>
    <text x="110" y="23" fill="#00f2fe" text-anchor="middle" font-weight="bold">⚡ SSH2 &amp; TLS DAEMON</text>
    
    <!-- Badge 2 -->
    <rect x="260" y="0" width="220" height="36" rx="6" fill="#1f242c" stroke="#00ff87" stroke-width="1"/>
    <text x="370" y="23" fill="#00ff87" text-anchor="middle" font-weight="bold">🔒 AES-256-GCM AUDIT</text>
    
    <!-- Badge 3 -->
    <rect x="520" y="0" width="220" height="36" rx="6" fill="#1f242c" stroke="#60efff" stroke-width="1"/>
    <text x="630" y="23" fill="#60efff" text-anchor="middle" font-weight="bold">🛡️ HMAC IP CLOAKING</text>
  </g>
</svg>
